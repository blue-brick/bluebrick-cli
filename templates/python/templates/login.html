{% extends "base.html" %}
{% block content %}
<main class="flex min-h-screen items-center justify-center p-6">
  <form method="post" action="{{ url_for('login') }}" class="w-full max-w-sm space-y-4 rounded-2xl border border-slate-800 bg-slate-900 p-8">
    <h1 class="text-2xl font-bold">🧱 {{name}}</h1>
    <p class="text-sm text-slate-400">Enter the admin password to continue.</p>
    {% if notice %}
      <p class="rounded-lg bg-emerald-500/10 px-3 py-2 text-sm text-emerald-400">{{ notice }}</p>
    {% endif %}
    {% if error %}
      <p class="rounded-lg bg-red-500/10 px-3 py-2 text-sm text-red-400">{{ error }}</p>
    {% endif %}
    <input type="password" name="password" placeholder="Password" required autofocus
      class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 outline-none focus:border-blue-500">
    <button type="submit" class="w-full rounded-lg bg-blue-600 px-3 py-2 font-semibold hover:bg-blue-500">Log in</button>
    <a href="{{ url_for('forgot') }}" class="block text-center text-sm text-slate-400 hover:text-slate-200">Forgot password?</a>
  </form>
</main>
{% endblock %}
